<script>
const PAGE = {key:"ll-hsa-day1-v1", day:"Day 1", title:"How Smart Are Animals?",
  intro:"Today you'll learn what makes a science article special, find one of your own, meet six new vocabulary words, and practice rereading like a scientist.",
  standards:["ELA.6.R.2.1 Text structure & features","ELA.6.V.1.1 Academic vocabulary","ELA.6.V.1.3 Context clues","ELA.6.R.3.2 Paraphrase","ELA.6.C.1.3 Expository writing"],
  checklist:[]};
const GROUPS = [{g:"all", title:"Today's Locks", note:"Go in order from Lock 1 to Lock 5."}];
const VOCAB_CHIPS = `<div class="chips">
<div class="chip"><b>evaluate</b> = to judge how good, useful, or true something is</div>
<div class="chip"><b>observing</b> = watching carefully to learn something</div>
<div class="chip"><b>investigation</b> = a careful study to find out the facts</div>
<div class="chip"><b>phenomenon</b> = something that happens that people can observe, often surprising</div>
<div class="chip"><b>interpret</b> = to explain or figure out the meaning of something</div>
<div class="chip"><b>measurable</b> = able to be measured or counted</div></div>`;
const STATIONS = [
{ id:"genre", std:["ELA.6.R.2.1"], g:"all", color:"#2a9d8f", title:"What Is a Science Article?", blurb:"Purpose, characteristics & structure",
  learn:[
   {h:"Purpose: why science articles are written", html:`<p>A <span class="term">science article</span> is nonfiction writing that <b>informs</b> and <b>explains</b> something about the natural world. Its purpose is to share discoveries, answer questions, and help readers understand how and why things happen.</p>
   <div class="tip">"How Smart Are Animals?" is a science article. It explores what scientists have learned about animal intelligence.</div>`},
   {h:"Characteristics: what you'll notice", html:`<ul><li><b>Facts and data</b> from research, experiments, and observations</li>
   <li><b>Science vocabulary</b>, sometimes in bold with definitions</li>
   <li><b>Experts</b> such as scientists and researchers, often quoted</li>
   <li><b>Text features</b> like headings, photos with captions, diagrams, and charts</li>
   <li>An <b>objective</b> tone: the author sticks to facts more than feelings</li></ul>`},
   {h:"Structure: how it's organized", html:`<ul><li><span class="term">Introduction</span>: hooks the reader and states the central idea, often with a question.</li>
   <li><span class="term">Body</span>: sections, often with <b>headings</b>, that explain the topic with evidence. Authors may use cause and effect, compare and contrast, problem and solution, or question and answer.</li>
   <li><span class="term">Conclusion</span>: wraps up the big idea and may tell what scientists still want to learn.</li></ul>`},
   {h:"Compare within genre: nonfiction", html:`<p>You already read "My Life with the Chimpanzees." Both texts are <b>nonfiction</b> about animals, but they are different kinds of nonfiction.</p>
   <ul><li><b>Memoir / autobiography</b> ("My Life with the Chimpanzees"): told in <b>first person</b> (I, me), shares the author's own experiences and feelings.</li>
   <li><b>Science article</b> ("How Smart Are Animals?"): usually <b>third person</b>, shares facts and research from many scientists, objective tone.</li></ul>`}
  ],
  example:{q:`Read this sentence: "I held my breath as the chimpanzee reached out and touched my hand." Is it more likely from a memoir or a science article?`,a:`A <b>memoir</b>. It uses <b>I</b> and <b>my</b> and shares the author's personal feelings. A science article would say something like, "Researchers observed that chimpanzees sometimes touch hands to greet one another."`},
  passageHtml:`<div class="passage"><div class="pt">Can Crows Solve Puzzles?</div>
  <p>Many people think of crows as noisy birds that dig through trash. But scientists who study crows have discovered that these birds are some of the best problem-solvers in the animal world.</p>
  <p style="font-family:var(--display);color:var(--c);margin-bottom:4px">Tools from Twigs</p>
  <p>On the island of New Caledonia, crows make their own tools. They bend and shape twigs into <b>hooks</b> and use them to pull insects out of holes in logs.</p>
  <p style="font-family:var(--display);color:var(--c);margin-bottom:4px">Remembering Faces</p>
  <p>In one study in Seattle, researchers wore masks while they captured and released a few crows. For years afterward, crows scolded people who wore the same mask, even crows that had never been caught. The birds had learned which face to watch out for.</p>
  <p style="font-size:15px;color:var(--muted)"><i>Caption idea: A crow uses a stick tool to reach food.</i></p></div>`,
  qs:[
   {t:"mc",d:1,q:"What is the main <b>purpose</b> of a science article?",opts:["to tell a made-up story","to inform and explain something about the natural world","to share the author's diary","to sell a product"],a:1,hint:"Think about the word science. What does the author want readers to learn?",why:"Science articles inform and explain, sharing what scientists have discovered."},
   {t:"multi",d:1,q:"Select ALL the characteristics of a science article.",opts:["facts and data from research","headings and photos with captions","rhyming lines","quotes from scientists","talking animal characters"],a:[0,1,3],hint:"Which ones would you find in a nonfiction text about science?",why:"Science articles use facts and data, text features like headings and captions, and expert quotes. Rhymes and talking animals belong in poems and fiction."},
   {t:"mc",d:2,q:"How do the headings <b>Tools from Twigs</b> and <b>Remembering Faces</b> help the reader?",opts:["They tell the reader what each section will be about.","They tell the ending of the article.","They give the author's opinion.","They are the names of crows."],a:0,hint:"Read each heading, then read the paragraph under it.",why:"Headings preview the main topic of each section, which helps readers find and understand information."},
   {t:"mc",d:2,q:"Why does the article begin with a question in the title and a common idea about crows?",opts:["to hook the reader, then show the surprising truth","to confuse the reader","to tell a story about the author","to list the parts of a crow"],a:0,hint:"The first paragraph says many people think one thing, but scientists found another.",why:"The introduction hooks readers with a common idea and then reveals the surprising discovery. That's a typical science article opening."},
   {t:"mc",d:2,q:`How is "Can Crows Solve Puzzles?" different from "My Life with the Chimpanzees"?`,opts:["The crow article is told in first person by the author.","The crow article shares research facts in third person instead of personal memories.","The crow article is fiction.","There is no difference."],a:1,hint:"Does the crow article use I and my?",why:"The crow article reports research from scientists in an objective, third-person voice. The chimpanzee memoir shares the author's own experiences."}
  ]},
{ id:"minute", std:["ELA.6.R.2.1", "ELA.K12.EE.2.1"], g:"all", color:"#0f7fa8", title:"Take a Minute", blurb:"Find a science article online",
  learn:[
   {h:"Be a science article detective", html:`<p>Find one more science article online. Kid-friendly science sites include:</p>
   <ul><li><a href="https://kids.nationalgeographic.com" target="_blank" rel="noopener">National Geographic Kids</a></li>
   <li><a href="https://nationalzoo.si.edu/animals" target="_blank" rel="noopener">Smithsonian's National Zoo: Animals</a></li>
   <li><a href="https://climatekids.nasa.gov" target="_blank" rel="noopener">NASA Climate Kids</a></li></ul>
   <div class="tip">On your iPad, split the screen so the article is on one side and this page is on the other.</div>`},
   {h:"Is it a reliable science article?", html:`<ul><li><b>Who wrote it?</b> Look for an author or a trusted organization, like a museum, university, zoo, or government science agency.</li>
   <li><b>When?</b> Look for a date. Science changes as we learn more.</li>
   <li><b>Facts?</b> Look for data, experts, and research, not just opinions.</li>
   <li><b>Web address clues:</b> <i>.gov</i> and <i>.edu</i> sites come from governments and schools. Many <i>.org</i> sites are museums and science groups.</li></ul>`}
  ],
  example:{q:`You find a page called "My Dog Is Smarter Than Your Dog!!!" on a personal blog with no author, no date, and no facts. Is it a strong science article?`,a:`<b>No.</b> It has no author, no date, and no research. It's an opinion post. A reliable science article would come from a trusted source and include facts and experts.`},
  qs:[
   {t:"mc",d:1,q:"Which source is MOST likely to have a reliable science article about animals?",opts:["a zoo or science museum website","an ad for pet food","a joke website","an anonymous comment section"],a:0,hint:"Which one is run by animal experts?",why:"Zoos and science museums have experts who study animals, so their articles are reliable."},
   {t:"mc",d:2,q:"Which clue BEST shows a web page is a science article?",opts:["It has lots of exclamation points.","It includes research data and quotes from a scientist.","It has funny memes.","It asks you to buy something."],a:1,hint:"Remember the characteristics from Lock 1.",why:"Research data and expert quotes are characteristics of a science article."},
   {t:"mc",d:2,q:"You found an article on a zoo website. Which detail BEST shows it is a reliable science article?",opts:["It has a funny title.","It names the zookeeper who wrote it, has a date, and includes facts from research.","It has lots of exclamation points.","It asks you to buy a stuffed animal."],a:1,hint:"Think about the reliability checklist: who, when, and facts.",why:"An author, a date, and research facts show the article is reliable and scientific."}
  ]},
{ id:"vocab", std:["ELA.6.V.1.1", "ELA.6.V.1.3"], g:"all", color:"#7b4fd6", title:"Concept Vocabulary", blurb:"Six science words",
  learn:[
   {h:"Six words scientists use", html:`<p>These words all describe how scientists <b>study</b> things. Watch for them in "How Smart Are Animals?"</p>${VOCAB_CHIPS}`},
   {h:"Word parts help you remember", html:`<ul><li><b>evaluate</b> has the word <i>value</i> inside it. When you evaluate, you decide the value of something.</li>
   <li><b>observing</b> comes from <i>observe</i>, to watch closely. <i>-ing</i> means it's happening now.</li>
   <li><b>investigation</b> = <i>investigate</i> + <i>-tion</i> (the act of). It's the act of investigating.</li>
   <li><b>measurable</b> = <i>measure</i> + <i>-able</i> (can be). It can be measured.</li>
   <li><b>interpret</b>: think of an interpreter, who explains what words mean in another language.</li>
   <li><b>phenomenon</b>: the plural is <i>phenomena</i>. Rainbows and lightning are natural phenomena.</li></ul>`}
  ],
  example:{q:`"The scientist spent weeks <b>observing</b> the octopus to see how it opened jars." What does observing mean here?`,a:`<b>Watching carefully.</b> The scientist watched the octopus closely to learn how it solved the jar puzzle.`},
  qs:[
   {t:"mc",d:1,q:"What does <b>measurable</b> mean?",opts:["very large","able to be measured or counted","hard to see","full of mistakes"],a:1,hint:"-able means can be.",why:"Measure + -able = can be measured or counted."},
   {t:"mc",d:1,q:"Which word means <b>a careful study to find out the facts</b>?",opts:["phenomenon","investigation","interpret","evaluate"],a:1,hint:"Detectives and scientists both do this.",why:"An investigation is a careful study to find facts."},
   {t:"mc",d:2,passage:`Thousands of birds flew in a giant swirling cloud at sunset. People stopped to watch this amazing <b>phenomenon</b>.`,q:"What does <b>phenomenon</b> mean in this sentence?",opts:["a kind of bird","something surprising that people can observe","a scientist's notebook","a loud noise"],a:1,hint:"People stopped to watch it. What is it?",why:"The swirling cloud of birds is an event people can observe. That's a phenomenon."},
   {t:"mc",d:2,passage:`The students had to <b>evaluate</b> three websites and decide which one had the most reliable information.`,q:"What does <b>evaluate</b> mean?",opts:["to copy","to judge how good or useful something is","to ignore","to draw a picture of"],a:1,hint:"They had to decide which one was best.",why:"Deciding which website is most reliable means judging its value. That's evaluate."},

{ id:"reread", std:["ELA.6.R.3.2", "ELA.K12.EE.2.1"], g:"all", color:"#e76f51", title:"Reread to Understand", blurb:"Monitor comprehension",
  learn:[
   {h:"Monitor your comprehension", html:`<p>Good readers <b>notice</b> when something doesn't make sense. That's called <span class="term">monitoring comprehension</span>.</p>
   <ul><li><b>Stop</b> when you feel confused or lost.</li><li><b>Reread</b> the sentence or paragraph slowly.</li><li><b>Look for key words</b>, like vocabulary words and signal words.</li><li><b>Use text features</b>: headings, captions, and diagrams can explain hard parts.</li><li><b>Say it in your own words</b> (paraphrase). If you can explain it, you understand it!</li></ul>
   <div class="tip">Science articles are packed with information. Even scientists reread!</div>`}
  ],
  example:{q:`You read: "The bee's dance communicates both direction and distance." You're confused. What should you do?`,a:`<b>Stop and reread.</b> Then break it down: the bee's dance <i>communicates</i> (tells) two things: <b>which way</b> to go and <b>how far</b> to go. In your own words: "The dance tells other bees where the food is and how far away it is."`},
  passage:{title:"The Honeybee Dance",lines:[
   "When a honeybee finds a good patch of flowers, it flies back to the hive to tell the other bees.",
   "But bees can't talk, so the bee does a special movement called the waggle dance.",
   "The bee runs in a straight line while shaking its body, then circles back and repeats the path.",
   "The direction of the straight run shows which way to fly compared to the sun.",
   "The longer the bee waggles, the farther away the flowers are.",
   "A scientist named Karl von Frisch spent years observing bees to interpret this dance, and he won a Nobel Prize for his investigation in 1973."]},
  qs:[

   {t:"tap",d:2,q:"Reread the passage. Tap the sentence that explains how bees show <b>how far</b> away the flowers are.",a:4,hint:"Look for words about distance, like far.",why:"The longer the waggle, the farther the flowers. That sentence explains distance."},
   {t:"mc",d:2,q:`After rereading, which is the best paraphrase of "The direction of the straight run shows which way to fly compared to the sun"?`,opts:["Bees fly toward the sun.","The way the bee runs in the dance points other bees toward the food, using the sun as a guide.","Bees only dance on sunny days.","The bee runs away from the hive."],a:1,hint:"A paraphrase keeps the same meaning in your own words.",why:"This choice keeps the full meaning: the run's direction points to the food, using the sun to guide."},

  ]},

const NOTES={"cover": "<p>Read the \u201cI can\u201d statements together. Tell students: we're about to read a <b>science article</b>, a new kind of nonfiction, and today you'll learn how to read it like a scientist.</p><p>Hook: \u201cRaise your hand if you think your pet is smart. How could a scientist <i>prove</i> it?\u201d Take 2\u20133 answers.</p>", "end": "<p>Have students reread the \u201cI can\u201d statements and give a thumbs up, sideways, or down for each one. Note anyone with a thumbs down for a quick check-in.</p>", "genre": {"intro": "<p>Connect: we just finished \u201cMy Life with the Chimpanzees,\u201d which is nonfiction too. Today we compare two kinds of nonfiction.</p>", "learn": ["<p>Ask: What does <b>inform</b> mean? What does <b>explain</b> mean? Have students tell you how they're different (inform = give facts; explain = tell how or why).</p>", "<p>Have students list where they've seen these features before, like science textbooks or a zoo website. Point out that a science article has an <b>objective</b> tone: facts more than feelings.</p>", "<p>Draw a quick three-box chart on the board: Introduction / Body / Conclusion. Students copy it into their notebooks.</p>", "<p>Make a T-chart: Memoir | Science Article. Fill in point of view, purpose, and tone together.</p>"], "example": "<p>Model: \u201cI see <b>I</b> and <b>my</b>, and the author shares a feeling, <i>held my breath</i>. That tells me it's a memoir.\u201d Then read the science-article version and point out the third-person, factual wording.</p>"}, "minute": {"intro": "<p>Students use their iPads in split screen. Give them 3\u20134 minutes to find one article.</p>", "learn": ["<p>Show one site on the board first so students know what a good science article page looks like. Point out the headings, photos, and captions.</p>", "<p>Model how to find the author and date on a real page. Explain .gov, .edu, and .org.</p>"], "example": "<p>Ask: \u201cWould you trust this page for your essay? Why or why not?\u201d Connect to the vocab word <b>evaluate</b>, which they'll learn next.</p>"}, "vocab": {"intro": "<p>These six words describe how scientists work. They'll show up in the article and on the vocabulary assignment.</p>", "learn": ["<p>Read each word and definition chorally. Have students act out <b>observing</b> (hands like binoculars) and <b>measurable</b> (pretend to use a ruler).</p>", "<p>Underline the word parts as you teach: <i>value</i> in evaluate, <i>-tion</i>, <i>-able</i>. Connect to our roots and affixes work.</p>"], "example": "<p>Think aloud: \u201cThe sentence says the scientist spent weeks doing this to see how the octopus opened jars, so observing must mean watching closely.\u201d</p>"}, "reread": {"intro": "<p>Tell students that even scientists reread. Today's goal is to notice confusion and fix it.</p>", "learn": ["<p>Model a \u201cclunk\u201d: read a dense sentence aloud, stop, and say \u201cWait, I lost it.\u201d Then reread slowly and paraphrase out loud.</p>"], "example": "<p>Break the sentence into two pieces on the board: <i>direction</i> = which way, <i>distance</i> = how far.</p>"}, "essay": {"intro": "<p>Students take out their Top Score planners for \u201cHow do people and animals interact?\u201d</p>", "learn": ["<p>Remind students: topic sentence \u2192 evidence \u2192 explanation. Point out that the crow mask study is a strong example of people and animals interacting.</p>"]}};


/* ======== BUILD SLIDES ======== */
const KEY_SVG = c => `<svg class="bigkey" viewBox="0 0 64 64" aria-hidden="true"><circle cx="20" cy="22" r="13" fill="none" stroke="${c}" stroke-width="7"/><path d="M29 31 L54 56 M44 46 L50 40 M49 51 L55 45" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>`;
const PRAISE = ["Way to go, class!","You unlocked it!","Brilliant thinking!","Nailed it!","Locksmith level up!","Super reader move!","Fantastic!","Yes! Great job!"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const allStd=[...new Set(STATIONS.flatMap(s=>s.std||[]))];
const stdBox=codes=>`<div class="stdbox"><span class="lbl">Florida B.E.S.T. Grade 6 Standards</span>${codes.map(c=>`<p><b>${c} · ${STD[c].h}:</b> ${STD[c].t}</p>`).join("")}</div>`;
const RESPOND = {mc:"Students: hold up A, B, C, or D", multi:"Students: write every letter that fits", tap:"Students: point to the sentence on the board", order:"Students: number the cards on your whiteboard", write:"Students: write your answer"};

const SLIDES=[];
SLIDES.push({sec:"Welcome",color:"#f2b705",kind:"cover",notes:NOTES.cover});
STATIONS.forEach((s,si)=>{
  const N=NOTES[s.id]||{};
  SLIDES.push({sec:s.title,color:s.color,kind:"divider",s,si,notes:N.intro||`Introduce ${s.title}. Read the standard with the class and connect it to "${PAGE.selection}."`});
  s.learn.forEach((l,i)=>SLIDES.push({sec:s.title,color:s.color,kind:"learn",s,l,i,notes:(N.learn&&N.learn[i])||"Read this slide aloud with the class. Have students restate the key terms in their own words."}));
  if(s.example) SLIDES.push({sec:s.title,color:s.color,kind:"example",s,notes:N.example||"Model your thinking out loud before you reveal the answer. Point to the clue words as you think."});
  s.qs.forEach((q,i)=>SLIDES.push({sec:s.title,color:s.color,kind:"q",s,q,i,notes:qNotes(q)}));
  SLIDES.push({sec:s.title,color:s.color,kind:"key",s,si,notes:"Celebrate! Ask: What is one thing you'll remember from this part of the lesson?"});
});
SLIDES.push({sec:"Wrap-Up",color:"#f2b705",kind:"end",notes:NOTES.end});

function qNotes(q){
  let ans="";
  if(q.t==="mc") ans="ABCDE"[q.a]+". "+q.opts[q.a];
  else if(q.t==="multi") ans=q.a.map(k=>"ABCDE"[k]).join(", ");
  else if(q.t==="tap") ans="Sentence "+(q.a+1);
  else if(q.t==="order") ans=q.items.join(" → ");
  else ans="See the model answer (reveal on the slide).";
  return `<p><b>${q.d===1?"DOK 1 (recall)":"DOK 2 (skill/concept)"}</b></p><p><b>Answer:</b> ${ans}</p>${q.hint?`<p><b>If students are stuck, prompt:</b> ${q.hint}</p>`:""}${q.why?`<p><b>Why:</b> ${q.why}</p>`:""}`;
}

/* ======== STATE (saved on this device) ======== */
let S={i:0,rev:{}};
try{ const r=localStorage.getItem(PAGE.key+"-teach"); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){}
const save=()=>{ try{ localStorage.setItem(PAGE.key+"-teach",JSON.stringify(S)); }catch(e){} };

/* ======== RENDER ======== */
const slideEl=document.getElementById("slide");
function passageOf(s,q){
  if(q && q.passage) return `<div class="passage">${q.passage}</div>`;
  if(s.passageHtml) return s.passageHtml;
  if(s.passage) return `<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<p style="margin:0 0 6px"><b style="color:var(--muted)">${k+1}</b> ${l}</p>`).join("")}</div>`;
  return "";
}
function render(anim=true){
  stopDrawingSave();
  const sl=SLIDES[S.i]; const s=sl.s;
  slideEl.style.setProperty("--c",sl.color);
  document.getElementById("brandTitle").textContent=`${PAGE.title} · ${PAGE.day}`;
  document.getElementById("secLabel").innerHTML=sl.s?`Part <b>${sl.si!==undefined?sl.si+1:STATIONS.indexOf(s)+1}</b> of ${STATIONS.length} · ${sl.sec}`:sl.sec;
  let h="";
  if(sl.kind==="cover"){
    h=`<div class="cover">${KEY_SVG("#c98f00")}<div class="day">${PAGE.day}</div><h1>${PAGE.title}</h1><p style="font-size:1.05em">${PAGE.selection}</p>
    <h3 style="margin-top:.6em;font-size:1.2em">Today, I can…</h3><div class="cando">${PAGE.cando.map(c=>`<div>${c}</div>`).join("")}</div>${stdBox(allStd)}</div>`;
  } else if(sl.kind==="divider"){
    h=`<div class="divider"><span class="num">Part ${sl.si+1} of ${STATIONS.length}</span><h2>${s.title}</h2><p style="font-size:1.1em">${s.blurb}</p>${s.std?stdBox(s.std):""}</div>`;
  } else if(sl.kind==="learn"){
    h=`<span class="tag">I do · Learn it</span><h2>${sl.l.h}</h2>${sl.l.html}`;
  } else if(sl.kind==="example"){
    const r=S.rev[S.i];
    h=`<span class="tag">We do · Think it through</span><h2>Let's try one together</h2><p class="q">${s.example.q}</p>
    <div class="reveal-row"><button class="btn dark" id="revealBtn" ${r?"hidden":""}>Reveal the thinking</button></div>
    <div class="answer" id="ans" ${r?"":"hidden"}><b class="big">How a locksmith thinks:</b>${s.example.a}</div>`;
  } else if(sl.kind==="q"){
    const q=sl.q, r=S.rev[S.i];
    const pass=(q.t!=="write"||q.passage||s.passage||s.passageHtml)?passageOf(s,q):"";
    let body=`<span class="tag">You do · Check ${sl.i+1} of ${s.qs.length}</span><br><span class="respond">${RESPOND[q.t]}</span><p class="q">${q.q}</p>`;
    if(q.t==="mc"||q.t==="multi") body+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ltr">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div>`;
    if(q.t==="order") body+=`<div class="opts">${q.items.map((t,k)=>({t,k})).sort((a,b)=>((a.k*7+3)%q.items.length)-((b.k*7+3)%q.items.length)).map(o=>`<div class="opt" data-k="${o.k}"><span class="ltr">?</span><span>${o.t}</span></div>`).join("")}</div>`;
    if(q.t==="write") body+=`<div class="starters">${q.starters.map(t=>`<span>${t}</span>`).join("")}</div>`;
    body+=`<div class="reveal-row"><button class="btn dark" id="revealBtn" ${r?"hidden":""}>${q.t==="write"?"Show a model answer":"Reveal answer"}</button></div><div id="fb"></div>`;
    let tapPass=pass;
    if(q.t==="tap"){ tapPass=`<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<button class="tapline" data-k="${k}"><b style="color:var(--muted)">${k+1}</b> ${l}</button>`).join("")}</div>`; }
    h=tapPass?`<div class="split two"><div>${tapPass}</div><div>${body}</div></div>`:body;
  } else if(sl.kind==="key"){
    h=`<div class="divider">${KEY_SVG(s.color)}<span class="num">Part ${sl.si+1} complete</span><h2>Key unlocked: ${s.title}!</h2><p style="font-size:1.1em">${pick(["Great work, readers! One more key on our ring.","You did it! That's how locksmiths work: one key at a time.","Amazing thinking today, class!"])}</p></div>`;
  } else if(sl.kind==="end"){
    h=`<div class="cover">${KEY_SVG("#c98f00")}<div class="day">${PAGE.day} complete!</div><h1>You unlocked every key!</h1>
    <h3 style="margin-top:.6em;font-size:1.2em">Look back: Today, I can…</h3><div class="cando">${PAGE.cando.map(c=>`<div>${c}</div>`).join("")}</div>
    ${PAGE.checklist.length?`<div class="tip"><b>Due today:</b> ${PAGE.checklist.join(" · ")}</div>`:""}
    ${PAGE.next?`<div class="tip"><b>Next:</b> ${PAGE.next}</div>`:""}</div>`;
  }
  slideEl.innerHTML=h;
  if(anim){ slideEl.classList.remove("enter"); void slideEl.offsetWidth; slideEl.classList.add("enter"); }
  slideEl.scrollTop=0;
  document.getElementById("count").textContent=`${S.i+1} / ${SLIDES.length}`;
  document.getElementById("barFill").style.width=((S.i)/(SLIDES.length-1)*100)+"%";
  document.getElementById("prev").disabled=S.i===0;
  document.getElementById("next").textContent=S.i===SLIDES.length-1?"Done 🎉":"Next ▶";
  const n=document.getElementById("notes"); n.innerHTML=`<h4>Teacher notes</h4>${/^</.test(sl.notes||"")?sl.notes:`<p>${sl.notes||""}</p>`}`;
  wire(sl);
  restorePen();
  if(sl.kind==="key" || sl.kind==="end") setTimeout(bigConfetti,200);

function markRevealed(sl){
  const q=sl.q;
  S.rev[S.i]=true; save();
  const rb=document.getElementById("revealBtn"); if(rb) rb.hidden=true;
  if(sl.kind==="example"){ document.getElementById("ans").hidden=false; popConfetti(); return; }
  if(q.t==="mc") slideEl.querySelectorAll(".opt").forEach(b=>{ if(+b.dataset.k===q.a) b.classList.add("right"); });
  if(q.t==="multi") slideEl.querySelectorAll(".opt").forEach(b=>{ if(q.a.includes(+b.dataset.k)) b.classList.add("right"); });
  if(q.t==="tap") slideEl.querySelectorAll(".tapline").forEach(b=>{ if(+b.dataset.k===q.a) b.classList.add("right"); });
  if(q.t==="order"){ const box=slideEl.querySelector(".opts"); box.innerHTML=q.items.map((t,k)=>`<div class="opt right"><span class="ltr">${k+1}</span><span>${t}</span></div>`).join(""); }
  const fb=document.getElementById("fb");
  if(q.t==="write") fb.innerHTML=`<div class="answer"><b class="big">Model answer</b>${q.model}<p style="margin-top:8px"><i>Check: Does your answer have these key ideas?</i></p></div>`;
  else fb.innerHTML=`<div class="answer"><b class="big">${pick(PRAISE)} ✨</b>${q.why}</div>`;
  popConfetti();
}
function wire(sl){
  const rb=document.getElementById("revealBtn");
  if(sl.kind==="example"){ if(rb) rb.onclick=()=>markRevealed(sl); return; }
  if(sl.kind!=="q") return;
  const q=sl.q;
  if(S.rev[S.i]){ markRevealedQuiet(sl); }
  if(rb) rb.onclick=()=>markRevealed(sl);
  // teacher can tap a class answer to check it
  if(q.t==="mc"||q.t==="tap"){
    slideEl.querySelectorAll(q.t==="mc"?".opt":".tapline").forEach(b=>b.onclick=()=>{
      if(S.rev[S.i]) return;
      if(+b.dataset.k===q.a){ markRevealed(sl); toast(pick(PRAISE)); }
      else { b.classList.add("wrong"); document.getElementById("fb").innerHTML=`<div class="hintbox"><b>Not quite. Try again!</b> 💡 ${q.hint}</div>`; }
    });
  }
  if(q.t==="multi"){
    slideEl.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(S.rev[S.i]) return;
      const k=+b.dataset.k;
      if(q.a.includes(k)){ b.classList.add("right"); const all=q.a.every(x=>slideEl.querySelector(`.opt[data-k="${x}"]`).classList.contains("right")); if(all){ markRevealed(sl); toast("Found them all!"); } else toast("Yes! Find another."); }
      else { b.classList.add("wrong"); document.getElementById("fb").innerHTML=`<div class="hintbox"><b>Not that one.</b> 💡 ${q.hint}</div>`; }
    });
  }
}
function markRevealedQuiet(sl){ const c=window.confetti; window.confetti=null; markRevealed(sl); window.confetti=c; }

/* ======== NAV ======== */
function go(i){ if(i<0||i>=SLIDES.length) return; savePen(); S.i=i; render(); }
document.getElementById("next").onclick=()=>{ if(S.i===SLIDES.length-1){ bigConfetti(); toast("Lesson complete! 🎉"); } else go(S.i+1); };
document.getElementById("prev").onclick=()=>go(S.i-1);
document.addEventListener("keydown",e=>{ if(e.target.closest("input,textarea")) return; if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(S.i+1);} if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(S.i-1);} if(e.key==="n") toggleNotes(); });
function toggleNotes(){ const n=document.getElementById("notes"); n.hidden=!n.hidden; document.getElementById("notesBtn").classList.toggle("on",!n.hidden); }
document.getElementById("notesBtn").onclick=toggleNotes;
const menu=document.getElementById("menu");
document.getElementById("menuBtn").onclick=()=>{
  menu.innerHTML=SLIDES.map((sl,i)=>({sl,i})).filter(o=>["cover","divider","end"].includes(o.sl.kind)).map(o=>`<button data-i="${o.i}">${o.sl.kind==="divider"?"Part "+(o.sl.si+1)+": "+o.sl.s.title:o.sl.kind==="cover"?"Welcome & goals":"Wrap-up"}</button>`).join("");
  menu.hidden=!menu.hidden;
  menu.querySelectorAll("button").forEach(b=>b.onclick=()=>{ menu.hidden=true; go(+b.dataset.i); });
};
document.getElementById("fsBtn").onclick=()=>{ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }catch(e){} };

/* ======== PEN (Apple Pencil / finger) ======== */
const cv=document.getElementById("pen"), ctx=cv.getContext("2d"); let penColor="#e0245e", drawing=false, last=null; const ink={};
function sizeCanvas(){ const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; const keep=cv.width?cv.toDataURL():null; cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap="round"; ctx.lineJoin="round"; if(keep){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=keep; } }
window.addEventListener("resize",sizeCanvas);
function savePen(){ try{ ink[S.i]=cv.toDataURL(); }catch(e){} }
function stopDrawingSave(){}
function restorePen(){ const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); if(ink[S.i]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=ink[S.i]; } }
cv.addEventListener("pointerdown",e=>{ drawing=true; last=pt(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pt(e); ctx.strokeStyle=penColor; ctx.lineWidth=e.pressure&&e.pointerType==="pen"?3+e.pressure*6:5; ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{ drawing=false; savePen(); }));
function pt(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
document.getElementById("penBtn").onclick=()=>{ document.body.classList.toggle("drawing"); document.getElementById("penBtn").classList.toggle("on",document.body.classList.contains("drawing")); };
document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{ penColor=s.dataset.c; });
document.getElementById("clearPen").onclick=()=>{ const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); delete ink[S.i]; };

/* ======== CELEBRATION ======== */
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function popConfetti(){ if(window.confetti) confetti({particleCount:90,spread:80,origin:{y:.7},colors:["#f2b705","#2a9d8f","#e76f51","#7b4fd6","#2c7be5"]}); }
function bigConfetti(){ if(!window.confetti) return; const end=Date.now()+1800; (function f(){ confetti({particleCount:6,angle:60,spread:60,origin:{x:0}}); confetti({particleCount:6,angle:120,spread:60,origin:{x:1}}); if(Date.now()<end) requestAnimationFrame(f); })(); confetti({particleCount:150,spread:110,origin:{y:.55}}); }

if(S.i>=SLIDES.length) S.i=0;
sizeCanvas(); render(false);
</script>

</body></html>
